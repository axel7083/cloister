<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only the key service user may own the name. -->
  <policy user="cloister">
    <allow own="io.github.axel7083.Cloister.KeyService"/>
  </policy>
  <!-- Anyone may call it: every key is scoped to the caller's uid and
       guarded by polkit. -->
  <policy context="default">
    <allow send_destination="io.github.axel7083.Cloister.KeyService"
           send_interface="io.github.axel7083.Cloister.KeyService1"/>
    <allow send_destination="io.github.axel7083.Cloister.KeyService"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.axel7083.Cloister.KeyService"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
